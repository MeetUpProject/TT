<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
</head>
<body>
<h1>📝 게시글 작성</h1>

<form id="writeForm">
    <label>제목: <input type="text" id="title" required></label><br><br>
    <label>내용: <textarea id="content" required></textarea></label><br><br>
    <label>작성자: <input type="text" id="writer" required></label><br><br>
    <label>비밀번호: <input type="password" id="password" required></label><br><br>
    <button type="submit">작성 완료</button>
</form>

<script src="/js/post_write.js"></script>
</body>
</html>
